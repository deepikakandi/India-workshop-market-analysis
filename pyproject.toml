[project]
name = "india-workshop-market-analysis"
version = "0.1.0"
description = "Analytics-engineering workspace for an Indian metro workshop-market study."
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "dbt-core>=1.8",
  "dbt-postgres>=1.8",
  "httpx>=0.27",
  "jupyterlab>=4.2",
  "pandas>=2.2",
  "pandera>=0.20",
  "polars>=1.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.9",
  "scrapy>=2.11",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
browser = [
  "playwright>=1.45",
]
analysis = [
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "statsmodels>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src"]
