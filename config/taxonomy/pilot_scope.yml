classification_output_fields:
  - primary_category_code
  - subcategory_code
  - secondary_category_codes
  - classification_confidence
  - classification_method
  - original_category_text

category_boundary_rules:
  - rule_id: coffee_painting_is_art
    rule: "Coffee painting is art_and_painting, not coffee_making."
  - rule_id: coffee_mug_activity_depends_on_material
    rule: "Coffee-mug painting or decoration is art_and_painting or pottery_and_ceramics depending on the material and activity."
  - rule_id: cafe_hosting_not_category
    rule: "A workshop hosted at a cafe is not automatically a coffee_making workshop."
  - rule_id: coffee_flavored_cake_is_baking
    rule: "Coffee-flavored cake belongs under cooking_and_baking."
  - rule_id: latte_art_is_coffee
    rule: "Latte art belongs under coffee_making."
  - rule_id: ceramic_painting_is_pottery
    rule: "Ceramic painting belongs under pottery_and_ceramics."
  - rule_id: resin_art_is_art
    rule: "Resin art belongs under art_and_painting."
  - rule_id: hybrid_secondary_tags
    rule: "A hybrid workshop may have one primary category and one or more secondary tags."
  - rule_id: preserve_source_text
    rule: "Preserve the original source category and title before assigning standardized categories."

