# Day 5 manual pilot source selection.
# This file selects concrete, individually reviewed first-party sources only.
# It does not authorize automated collection or bulk extraction.

schema_version: 2
created_at: "2026-08-05"
reviewed_by: Codex
manual_collection_policy:
  decision_value_required: approved_manual_collection
  automation_allowed: false
  desired_overall_record_range: "approximately 40-70 distinct manual event/course records when available"
  range_is_mandatory: false
  quality_and_uniqueness_priority: true
  shortfall_policy: >-
    Falling below 40 records is acceptable when approved sources do not expose enough
    distinct, verifiable records. Researchers must not manufacture, duplicate, split,
    or repeatedly enter the same workshop only to satisfy a target.
  distinct_record_rule: >-
    A manual record must represent a distinct workshop occurrence, distinct recurring
    program, distinct course product, or independently observable historical event.
    The same workshop must not be duplicated, split, or repeatedly entered only to
    meet a source target.
  scope_note: >-
    approved_manual_collection is an internal project-governance decision. It permits
    narrow transcription of factual public fields for internal research only and does
    not imply that the source owner granted a license or endorsed the project. Do not
    copy full descriptions, images, protected creative content, review text, customer
    details, cookies, credentials, or page payloads. Retain source URL and observation
    timestamp.
